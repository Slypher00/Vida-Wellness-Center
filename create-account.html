<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="create-account.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  </head>

  <body>
    <header>
      <h1>Vida Wellness Center</h1>
    </header>
    <main>
      <form method="POST">
        <h2>Create Account</h2>
        <fieldset>
          <label for="email">Email</label>
          <input
            id="email"
            placeholder="name@example.com"
            type="email"
            name="email"
            autocapitalize="none">
          <div id="name">
            <div id="form-group">
              <label for="fname">Legal First Name</label>
              <input
                id="fname"
                placeholder="John"
                type="text"
                name="fname"
                autocapitalize="none">
            </div>
            <div id="form-group">
              <label for="lname">Legal Last Name</label>
              <input
                id="lname"
                placeholder="Doe"
                type="text"
                name="lname"
                autocapitalize="none">
            </div>
          </div>
          <label for="pname">Preferred Name (optional)</label>
          <input
            id="pname"
            type="text"
            name="pname"
            autocapitalize="none">
          <label for="dob">Date Of Birth</label>
          <input
            id="dob"
            type="date"
            name="dob"
            autocapitalize="none">
          <div id="gender">
            <legend> Choose Gender Identity</legend>
            <div>
              <div class="gen-btn">
                <input
                  id="male"
                  type="radio"
                  name="gender"
                  value="male">
                <label for="male">Male</label>
              </div>
            </div>
            <div>
              <div class="gen-btn">
                <input
                  id="female"
                  type="radio"
                  name="gender"
                  value="female">
                <label for="female">Female</label>
              </div>
            </div>
          </div>
          <button id="gender-btn" type="button">More options</button>
          <label for="password">Password</label>
          <input
            id="password"
            placeholder="password"
            type="password"
            name="password"
            autocapitalize="none">
          <label for="conferm-pass">Confirm Password</label>
          <input
            id="conferm-pass"
            placeholder="password"
            type="password"
            name="conferm-pass"
            autocapitalize="none">  
        </fieldset>
        <button type="submit" id="btn-crt"><a href="questionnaire-main.html">Create</a></button>
        <p>Already have an account?<a href="Login-page.html"> Log in.</a></p>
        </form>
    </main>
    <div id="gender-modal" class="hidden">
      <div class="modal-content">
        <h1>Select Your Gender Identity</h1>
        <ul id="gender-id">
          <li>
            <label for="afab">Assigned female at birth</label>
            <input
              type="checkbox"
              id="afab"
              name="afab"
              value="afab">
          </li>
          <li>
            <label for="amab">Assigned male at birth</label>
            <input
              type="checkbox"
              id="amab"
              name="amab"
              value="amab">
          </li>
          <li>
            <label for="cf">Cisgender woman</label>
            <input
              type="checkbox"
              id="cf"
              name="cf"
              value="cf">
          </li>
          <li>
            <label for="cm">Cisgender man</label>
            <input
              type="checkbox"
              id="cm"
              name="cm"
              value="cm">
          </li>
          <li>
            <label for="tf">Transgender woman</label>
            <input
              type="checkbox"
              id="tf"
              name="tf"
              value="tf">
          </li>
          <li>
            <label for="tm">Transgender man</label>
            <input
              type="checkbox"
              id="tm"
              name="tm"
              value="tm">
          </li>
          <li>
            <label for="nb">Non-binary</label>
            <input
              type="checkbox"
              id="nb"
              name="nb"
              value="nb">
          </li>
          <li>
            <label for="gf">Genderfluid</label>
            <input
              type="checkbox"
              id="gf"
              name="gf"
              value="gf">
          </li>
          <li>
            <label for="ag">Genderqueer</label>
            <input
              type="checkbox"
              id="ag"
              name="ag"
              value="ag">
          </li>
          <li>
            <label for="is">Intersex</label>
            <input
              type="checkbox"
              id="is"
              name="is"
              value="is">
          </li>
          <li>
            <label for="na">Prefer not to say</label>
            <input
              type="checkbox"
              id="na"
              name="na"
              value="na">
          </li>
        </ul>
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit" id="submit-btn">Submit</button>
      </div>
    </div>
    <script src="creat-account.js"></script>
  </body>
